# GeyMatiMataJiApp/apphosting.yaml
runtime: nodejs

runConfig:
  rootDirectory: /
  minInstances: 0
  maxInstances: 1
  cpu: 1
  memoryMiB: 512

# Explicitly installs local subfolder node_modules before compiling code
scripts:
  buildCommand: npm install --prefix admin-dashboard && npm run build --prefix admin-dashboard
  runCommand: npm run start --prefix admin-dashboard

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBNb9AAgpi4gmB3GoJssnNfmkWWTNUmgNs
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: mataji-59cbf.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: mataji-59cbf
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: mataji-59cbf.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1066373562809"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1066373562809:web:423216cece1de35b90f668"
