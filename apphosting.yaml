# GeyMatiMataJiApp/apphosting.yaml
runtime: nodejs

runConfig:
  rootDirectory: /
  minInstances: 0
  maxInstances: 1
  cpu: 1
  memoryMiB: 512

# Explicitly switches context inside the build workspace container
scripts:
  buildCommand: cd admin-dashboard && npm run build
  runCommand: cd admin-dashboard && npm run start

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD0lfXZUbYQtKxQxgfgDMpt-7KD63bjKgk
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ://firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: gyeshreemataji
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: gyeshreemataji.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "932184806507"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:932184806507:web:8f2065b1650d4b405b0d2e"
    availability:
      - BUILD
      - RUNTIME
